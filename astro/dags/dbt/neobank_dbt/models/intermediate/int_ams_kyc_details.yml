version: 2

models:
  - name: int_ams_kyc_details
    description: Staging model for KYC details with cleaning and validation
    columns:
      - name: kyc_id
        description: Unique KYC identifier (16 characters)
        data_type: varchar(16)
        tests:
          - not_null
          - unique
          - check_id_length:
              id_length: 16
      - name: kyc_completed
        description: Indicates if KYC is completed (True or False, can be null)
        data_type: boolean
        tests:
          - accepted_values:
              values: [True, False]
              config:
                where: "kyc_completed IS NOT NULL"
      - name: kyc_verified_at
        description: Timestamp when KYC was verified (between 2024-01-01 and current date, can be null)
        data_type: timestamp
        tests:
          - check_date_range:
              config:
                where: "kyc_verified_at IS NOT NULL"
      - name: dwh_creation_date
        description: Timestamp when the record was created in the DWH
        data_type: timestamp
        tests:
          - not_null
