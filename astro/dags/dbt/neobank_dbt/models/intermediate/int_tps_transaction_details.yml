version: 2

models:
  - name: int_tps_transaction_details
    description: Staging model for transaction details with cleaning and validation
    columns:
      - name: transaction_sk
        description: Unique transaction secret key (12 characters)
        data_type: varchar(12)
        tests:
          - not_null
          - unique
          - check_id_length:
              id_length: 12
      - name: currency
        description: Currency code (USD, TZS, RWF, UGX, KES, can be null)
        data_type: varchar(3)
        tests:
          - accepted_values:
              values: ['USD', 'TZS', 'RWF', 'UGX', 'KES']
              config:
                where: "currency IS NOT NULL"
      - name: transaction_type
        description: Transaction type (Withdrawal, Deposit, can be null)
        data_type: varchar(10)
        tests:
          - accepted_values:
              values: ['Withdrawal', 'Deposit']
              config:
                where: "transaction_type IS NOT NULL"
      - name: transaction_status
        description: Transaction status (Pending, Completed, or Failed, can be null)
        data_type: varchar(9)
        tests:
          - accepted_values:
              values: ['Pending', 'Completed', 'Failed']
              config:
                where: "transaction_status IS NOT NULL"
      - name: topup_method
        description: Topup method (Bank Transfer, Cash Desk, Mpesa, PayPal, Card Payment, can be null)
        data_type: varchar(20)
        tests:
          - accepted_values:
              values: ['Bank Transfer', 'Cash Desk', 'Mpesa', 'PayPal', 'Card Payment']
              config:
                where: "topup_method IS NOT NULL"
      - name: transaction_date
        description: Timestamp of the transaction (between 2024-01-01 and current date, can be null)
        data_type: timestamp
        tests:
          - check_date_range:
              config:
                where: "transaction_date IS NOT NULL"
      - name: dwh_creation_date
        description: Timestamp when the record was created in the DWH
        data_type: timestamp
        tests:
          - not_null
