version: 2

models:
  - name: int_ams_biometric_details
    description: Staging model for biometric details with cleaning and validation
    columns:
      - name: biometric_id
        description: Unique biometric identifier (16 characters)
        data_type: varchar(16)
        tests:
          - not_null
          - unique
          - check_id_length:
              id_length: 16
      - name: uses_biometric
        description: Indicates if biometric is used (True or False)
        data_type: boolean
        tests:
          - accepted_values:
              values: [True, False]
      - name: biometric_verified_at
        description: Timestamp when biometric was verified (between 2024-01-01 and current date)
        data_type: timestamp
        # tests:
        #   - check_date_range
      - name: dwh_creation_date
        description: Timestamp when the record was created in the DWH
        data_type: timestamp
        tests:
          - not_null
